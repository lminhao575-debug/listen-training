<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>聽故事大挑戰</title>
<style>
  :root {
    --bg: #FFF8EC;
    --card: #FFFFFF;
    --ink: #4A3B2A;
    --accent: #FF9F43;
    --accent-deep: #F2843B;
    --green: #6BCB77;
    --blue: #5BA8F5;
    --shadow: 0 4px 14px rgba(120, 90, 40, .12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
    display: flex; justify-content: center; min-height: 100vh;
  }
  #app { width: 100%; max-width: 480px; padding: 20px 18px 40px; }

  /* 課本式直式注音：字右側由上往下，聲調在右、輕聲在頂 */
  .zi { display: inline-flex; align-items: center; }
  .han { line-height: 1.25; }
  .bpm {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: .42em; line-height: 1.06; color: #A08A6A; font-weight: 400;
    margin: 0 .35em 0 .1em; position: relative; min-width: 1em;
  }
  .bpm .tone { position: absolute; right: -.7em; bottom: 0; }
  .bpm .nt { line-height: 1; }

  .screen { display: none; animation: fade .25s ease; }
  .screen.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  h1.app-title { text-align: center; font-size: 1.85rem; margin: 10px 0 4px; }
  .subtitle { text-align: center; font-size: 1.15rem; margin-bottom: 22px; color: #8A7355; }

  .topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .topic-btn {
    background: var(--card); border: none; border-radius: 22px; box-shadow: var(--shadow);
    padding: 22px 8px 18px; font-size: 1.35rem; color: var(--ink); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .topic-btn .emoji { font-size: 2.6rem; }
  .topic-btn:active { transform: scale(.96); }

  .back-link { background: none; border: none; color: #B09468; font-size: 1rem; padding: 6px 0; cursor: pointer; }

  .story-card {
    width: 100%; background: var(--card); border: none; border-radius: 20px; box-shadow: var(--shadow);
    padding: 20px 18px; margin-bottom: 14px; font-size: 1.4rem; color: var(--ink);
    display: flex; align-items: center; justify-content: space-between; cursor: pointer; text-align: left;
  }
  .story-card:active { transform: scale(.98); }
  .story-card .star { font-size: 1.5rem; }

  .play-wrap { text-align: center; padding-top: 8px; }
  .play-topic-emoji { font-size: 3.4rem; margin: 6px 0; }
  .play-title { font-size: 2.1rem; margin: 4px 0 26px; }
  .big-play {
    width: 132px; height: 132px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(145deg, var(--accent), var(--accent-deep));
    color: #fff; font-size: 3.2rem; box-shadow: 0 8px 22px rgba(242, 132, 59, .45);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .big-play:active { transform: scale(.94); }
  .listen-hint { font-size: 1.2rem; color: #A08A6A; margin: 18px 0 6px; }
  .progress-track { height: 10px; background: #F0E3CC; border-radius: 6px; margin: 20px 10px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--green); border-radius: 6px; transition: width .3s linear; }

  .btn {
    display: block; width: 100%; border: none; border-radius: 18px; cursor: pointer;
    padding: 16px; font-size: 1.35rem; color: #fff; margin-top: 14px; box-shadow: var(--shadow);
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--green); }
  .btn.primary:disabled { background: #D8CDB8; box-shadow: none; cursor: default; }
  .btn.secondary { background: var(--blue); }
  .btn.plain { background: var(--card); color: var(--ink); }

  .quiz-label { text-align: center; font-size: 1.15rem; color: #B09468; margin-bottom: 6px; }
  .quiz-emoji { text-align: center; font-size: 2.8rem; margin: 8px 0; }
  .quiz-card {
    background: var(--card); border-radius: 22px; box-shadow: var(--shadow);
    padding: 26px 12px; text-align: center; font-size: 1.72rem; line-height: 1.9;
  }
  .speak-btn {
    margin-top: 16px; border: none; background: #FFF1DC; color: var(--accent-deep);
    border-radius: 30px; padding: 12px 26px; font-size: 1.15rem; cursor: pointer;
  }
  .speak-btn:active { transform: scale(.95); }
  .quiz-hint { text-align: center; color: #A08A6A; font-size: 1.15rem; margin-top: 16px; }
  .dots { display: flex; justify-content: center; gap: 10px; margin: 18px 0 4px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #E8DAC0; }
  .dot.on { background: var(--accent); }

  .done-emoji { text-align: center; font-size: 4.2rem; margin: 24px 0 8px; }
  .done-title { text-align: center; font-size: 1.9rem; margin-bottom: 24px; }

  .parent-block { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; }
  .parent-block h3 { margin: 0 0 10px; font-size: 1.1rem; color: var(--accent-deep); }
  .parent-block p { margin: 6px 0; font-size: 1rem; line-height: 1.75; }
  .ref-q { font-weight: 700; margin-top: 14px; }
  .ref-dim { font-size: .85rem; color: #B09468; margin-left: 6px; font-weight: 400; }
  .parent-link { display: block; text-align: center; margin-top: 22px; background: none; border: none; color: #C4AD88; font-size: .95rem; cursor: pointer; width: 100%; }
  .ref-box {
    background: #FFF6E4; border: 1px dashed #E3CBA0; border-radius: 14px;
    padding: 12px 14px; margin-top: 10px; font-size: .95rem; line-height: 1.7; color: #7A6647;
  }
</style>
</head>
<body>
<div id="app">
  <div id="screen-home" class="screen"></div>
  <div id="screen-list" class="screen"></div>
  <div id="screen-play" class="screen"></div>
  <div id="screen-quiz" class="screen"></div>
  <div id="screen-done" class="screen"></div>
  <div id="screen-parent" class="screen"></div>
</div>
<audio id="player" preload="auto"></audio>
<script>
const Z = {
  appTitle: '聽|ㄊㄧㄥ 故|ㄍㄨˋ 事|˙ㄕ 大|ㄉㄚˋ 挑|ㄊㄧㄠˇ 戰|ㄓㄢˋ',
  pickTopic: '選|ㄒㄩㄢˇ 一|ㄧ 個|˙ㄍㄜ 主|ㄓㄨˇ 題|ㄊㄧˊ',
  pickStory: '選|ㄒㄩㄢˇ 一|ㄧ 個|˙ㄍㄜ 故|ㄍㄨˋ 事|˙ㄕ',
  listenHint: '仔|ㄗˇ 細|ㄒㄧˋ 聽|ㄊㄧㄥ ， 等|ㄉㄥˇ 一|ㄧ 下|ㄒㄧㄚˋ 要|ㄧㄠˋ 回|ㄏㄨㄟˊ 答|ㄉㄚˊ 問|ㄨㄣˋ 題|ㄊㄧˊ 喔|ㄛ ！',
  startQuiz: '開|ㄎㄞ 始|ㄕˇ 回|ㄏㄨㄟˊ 答|ㄉㄚˊ',
  listenAgain: '再|ㄗㄞˋ 聽|ㄊㄧㄥ 一|ㄧ 次|ㄘˋ',
  next: '下|ㄒㄧㄚˋ 一|ㄧ 題|ㄊㄧˊ',
  finish: '我|ㄨㄛˇ 答|ㄉㄚˊ 完|ㄨㄢˊ 了|˙ㄌㄜ ！',
  speakQ: '唸|ㄋㄧㄢˋ 題|ㄊㄧˊ 目|ㄇㄨˋ',
  quizHint: '用|ㄩㄥˋ 說|ㄕㄨㄛ 的|˙ㄉㄜ ， 回|ㄏㄨㄟˊ 答|ㄉㄚˊ 給|ㄍㄟˇ 大|ㄉㄚˋ 人|ㄖㄣˊ 聽|ㄊㄧㄥ',
  great: '太|ㄊㄞˋ 棒|ㄅㄤˋ 了|˙ㄌㄜ ！',
  another: '換|ㄏㄨㄢˋ 一|ㄧ 個|˙ㄍㄜ 故|ㄍㄨˋ 事|˙ㄕ',
  home: '回|ㄏㄨㄟˊ 首|ㄕㄡˇ 頁|ㄧㄝˋ',
};
const DIMS = ['記憶提取', '因果推論', '情緒推論', '高階應用'];

let DATA = null;
const state = { topic: null, story: null, qIndex: 0, listened: false };
const player = document.getElementById('player');
const doneKey = 'listen_training_done_v1';
const getDone = () => JSON.parse(localStorage.getItem(doneKey) || '{}');
const markDone = id => { const d = getDone(); d[id] = true; localStorage.setItem(doneKey, JSON.stringify(d)); };

function ruby(z) {
  return z.split(' ').map(tok => {
    if (!tok.includes('|')) return `<span>${tok}</span>`;
    const [c, b] = tok.split('|');
    let syms = b, top = '', tone = '';
    if (syms.startsWith('˙')) { top = '<span class="nt">˙</span>'; syms = syms.slice(1); }
    if ('ˊˇˋ'.includes(syms.slice(-1))) { tone = `<span class="tone">${syms.slice(-1)}</span>`; syms = syms.slice(0, -1); }
    const col = [...syms].map(s => `<span>${s}</span>`).join('');
    return `<span class="zi"><span class="han">${c}</span><span class="bpm">${top}${col}${tone}</span></span>`;
  }).join('');
}
function show(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  window.scrollTo(0, 0);
}
function stopAudio() { player.pause(); player.currentTime = 0; }

function renderHome() {
  const el = document.getElementById('screen-home');
  el.innerHTML = `
    <h1 class="app-title">${ruby(Z.appTitle)}</h1>
    <p class="subtitle">${ruby(Z.pickTopic)}</p>
    <div class="topic-grid">
      ${DATA.topics.map(t => `
        <button class="topic-btn" data-topic="${t.id}">
          <span class="emoji">${t.emoji}</span>
          <span>${ruby(t.nameZ)}</span>
        </button>`).join('')}
    </div>`;
  el.querySelectorAll('.topic-btn').forEach(b => b.onclick = () => {
    state.topic = DATA.topics.find(t => t.id === b.dataset.topic);
    renderList(); show('list');
  });
}

function renderList() {
  const el = document.getElementById('screen-list');
  const done = getDone();
  const stories = DATA.stories.filter(s => s.topic === state.topic.id);
  el.innerHTML = `
    <button class="back-link">← ${ruby(Z.home)}</button>
    <h1 class="app-title">${state.topic.emoji} ${ruby(state.topic.nameZ)}</h1>
    <p class="subtitle">${ruby(Z.pickStory)}</p>
    ${stories.map(s => `
      <button class="story-card" data-id="${s.id}">
        <span>🎧 ${ruby(s.titleZ)}</span>
        <span class="star">${done[s.id] ? '⭐' : ''}</span>
      </button>`).join('')}`;
  el.querySelector('.back-link').onclick = () => { stopAudio(); show('home'); };
  el.querySelectorAll('.story-card').forEach(b => b.onclick = () => {
    state.story = DATA.stories.find(s => s.id === b.dataset.id);
    state.listened = false;
    renderPlay(); show('play');
  });
}

function renderPlay() {
  const el = document.getElementById('screen-play');
  el.innerHTML = `
    <button class="back-link">← ${ruby(Z.another)}</button>
    <div class="play-wrap">
      <div class="play-topic-emoji">${state.topic.emoji}</div>
      <div class="play-title">${ruby(state.story.titleZ)}</div>
      <button class="big-play" id="btn-play">▶</button>
      <p class="listen-hint">${ruby(Z.listenHint)}</p>
      <div class="progress-track"><div class="progress-fill" id="bar"></div></div>
      <button class="btn primary" id="btn-quiz" disabled>${ruby(Z.startQuiz)}</button>
    </div>`;
  el.querySelector('.back-link').onclick = () => { stopAudio(); renderList(); show('list'); };

  const btnPlay = el.querySelector('#btn-play');
  const btnQuiz = el.querySelector('#btn-quiz');
  const bar = el.querySelector('#bar');
  if (state.listened) btnQuiz.disabled = false;

  player.src = `audio/${state.story.id}.mp3`;
  player.onended = () => { state.listened = true; btnQuiz.disabled = false; btnPlay.textContent = '▶'; bar.style.width = '100%'; };
  player.ontimeupdate = () => { if (player.duration) bar.style.width = (player.currentTime / player.duration * 100) + '%'; };
  player.onerror = () => { state.listened = true; btnQuiz.disabled = false; };

  btnPlay.onclick = () => {
    if (player.paused) { player.play(); btnPlay.textContent = '⏸'; }
    else { player.pause(); btnPlay.textContent = '▶'; }
  };
  btnQuiz.onclick = () => { stopAudio(); state.qIndex = 0; renderQuiz(); show('quiz'); };
}

function renderQuiz() {
  const el = document.getElementById('screen-quiz');
  const q = DATA.questions[state.qIndex];
  const last = state.qIndex === DATA.questions.length - 1;
  el.innerHTML = `
    <p class="quiz-label">${ruby(q.label)}</p>
    <div class="quiz-emoji">${q.emoji}</div>
    <div class="quiz-card">
      ${ruby(q.textZ)}
      <div><button class="speak-btn" id="btn-speak">🔊 ${ruby(Z.speakQ)}</button></div>
    </div>
    <p class="quiz-hint">💬 ${ruby(Z.quizHint)}</p>
    <div class="dots">${DATA.questions.map((_, i) => `<div class="dot ${i <= state.qIndex ? 'on' : ''}"></div>`).join('')}</div>
    <button class="btn ${last ? 'secondary' : 'primary'}" id="btn-next">${ruby(last ? Z.finish : Z.next)}</button>
    <button class="parent-link" id="btn-ref">🔑 參考答案（家長看）</button>
    <div class="ref-box" id="ref-box" hidden>
      <span class="ref-dim">（${DIMS[state.qIndex]}）</span>${state.story.refs[state.qIndex]}
    </div>`;
  el.querySelector('#btn-ref').onclick = () => {
    const box = el.querySelector('#ref-box');
    box.hidden = !box.hidden;
  };
  el.querySelector('#btn-speak').onclick = () => {
    player.src = `audio/${q.id}.mp3`;
    player.play();
  };
  el.querySelector('#btn-next').onclick = () => {
    stopAudio();
    if (last) { markDone(state.story.id); renderDone(); show('done'); }
    else { state.qIndex++; renderQuiz(); show('quiz'); }
  };
}

function renderDone() {
  const el = document.getElementById('screen-done');
  el.innerHTML = `
    <div class="done-emoji">🎉</div>
    <div class="done-title">⭐ ${ruby(Z.great)}</div>
    <button class="btn primary" id="btn-again">🎧 ${ruby(Z.listenAgain)}</button>
    <button class="btn secondary" id="btn-another">📚 ${ruby(Z.another)}</button>
    <button class="btn plain" id="btn-home">🏠 ${ruby(Z.home)}</button>
    <button class="parent-link" id="btn-parent">家長對照區（給爸爸媽媽看的）</button>`;
  el.querySelector('#btn-again').onclick = () => { state.listened = false; renderPlay(); show('play'); };
  el.querySelector('#btn-another').onclick = () => { renderList(); show('list'); };
  el.querySelector('#btn-home').onclick = () => show('home');
  el.querySelector('#btn-parent').onclick = () => { renderParent(); show('parent'); };
}

function renderParent() {
  const el = document.getElementById('screen-parent');
  const s = state.story;
  el.innerHTML = `
    <button class="back-link">← 返回</button>
    <div class="parent-block">
      <h3>📖 故事全文：${s.title}</h3>
      <p>${s.text}</p>
    </div>
    <div class="parent-block">
      <h3>✅ 參考答案方向</h3>
      ${DATA.questions.map((q, i) => `
        <p class="ref-q">${i + 1}. ${q.text}<span class="ref-dim">（${DIMS[i]}）</span></p>
        <p>${s.refs[i]}</p>`).join('')}
    </div>
    <div class="parent-block">
      <h3>💡 使用小提示</h3>
      <p>・答案不必和參考一模一樣，孩子有講到重點、能用自己的話說出來就算好。</p>
      <p>・第 3、4 題沒有標準答案，重點是讓孩子練習表達感受和想法，多問「還有呢？」。</p>
      <p>・回答卡住時，可以讓他「再聽一次」再答，這也是很好的訓練。</p>
    </div>`;
  el.querySelector('.back-link').onclick = () => show('done');
}

fetch('stories.json')
  .then(r => r.json())
  .then(d => { DATA = d; renderHome(); show('home'); })
  .catch(() => { document.getElementById('app').innerHTML = '<p style="text-align:center">載入失敗，請重新整理</p>'; });
</script>
</body>
</html>
